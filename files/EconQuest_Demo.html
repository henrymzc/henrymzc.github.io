<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EconQuest · Demo</title>
<style>
:root{
  --ink:#20180f;
  --ink-soft:#5a4c38;
  --parch:#f3ead7;
  --parch-deep:#e9dcc0;
  --bg:#182420;
  --bg-panel:#213029;
  --gold:#c7973b;
  --gold-bright:#e0b45c;
  --seal:#b23a2c;
  --leaf:#557a44;
  --line:#d6c8a8;
  --shadow:rgba(10,14,10,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 50% -10%, #24352d 0%, var(--bg) 55%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--parch);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;
}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}

/* ── top bar ── */
#topbar{
  width:100%;max-width:760px;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px 10px;
  font-size:13px;letter-spacing:.06em;color:#bfd0be;
}
#topbar .brand{font-weight:700;color:var(--gold-bright);letter-spacing:.2em}
#topbar .meta{display:flex;gap:18px}
#topbar .meta b{color:var(--parch)}

/* ── stage ── */
#stage{width:100%;max-width:760px;padding:6px 16px 40px;flex:1}
.card{
  background:var(--parch);
  color:var(--ink);
  border-radius:6px;
  box-shadow:0 12px 40px var(--shadow), inset 0 0 0 1px #fff8;
  padding:30px 34px 28px;
  position:relative;
  animation:cardIn .45s cubic-bezier(.2,.9,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card::before{
  content:"";position:absolute;inset:8px;border:1px solid var(--line);
  border-radius:3px;pointer-events:none;
}
.eyebrow{font-size:11px;letter-spacing:.26em;color:var(--seal);font-weight:700;margin-bottom:10px}
h1{font-size:40px;letter-spacing:.04em;margin:6px 0 4px;color:var(--ink)}
h2{font-size:24px;letter-spacing:.02em;margin-bottom:4px}
h3{font-size:16px;margin:16px 0 6px;color:var(--ink)}
p{line-height:1.75;color:var(--ink);font-size:15px}
.dim{color:var(--ink-soft);font-size:13.5px;line-height:1.75}

/* ── npc dialogue ── */
.npc-row{display:flex;gap:16px;align-items:flex-start;margin:14px 0 18px}
.avatar{
  width:52px;height:52px;flex:0 0 52px;border-radius:50%;
  background:var(--bg-panel);color:var(--gold-bright);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;border:2px solid var(--gold);
}
.bubble{
  background:#fffdf6;border:1px solid var(--line);border-radius:4px;
  padding:14px 18px;flex:1;position:relative;
}
.bubble::before{
  content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;
  background:#fffdf6;border-left:1px solid var(--line);border-bottom:1px solid var(--line);
  transform:rotate(45deg);
}
.npc-name{font-size:12px;letter-spacing:.12em;color:var(--seal);font-weight:700;margin-bottom:4px}
.bubble p{font-size:15px}

/* ── anim frame ── */
.animbox{
  background:#fbf6e9;border:1px solid var(--line);border-radius:4px;
  padding:12px;margin:6px 0 16px;display:flex;justify-content:center;
}
.animbox svg{max-width:100%;height:auto}
.anim-cap{font-size:11.5px;color:var(--ink-soft);text-align:center;margin:-10px 0 16px;letter-spacing:.03em}

/* ── formula shortcut ── */
details.formula{
  border:1px dashed var(--gold);border-radius:4px;background:#fdf8ec;
  margin:0 0 18px;padding:0;
}
details.formula summary{
  cursor:pointer;padding:10px 16px;font-size:13px;font-weight:700;color:#8a6516;
  letter-spacing:.08em;list-style:none;user-select:none;
}
details.formula summary::before{content:"⚡ ";}
details.formula[open] summary{border-bottom:1px dashed var(--gold)}
details.formula .fbody{padding:12px 18px 14px}
.expr{
  font-family:"Courier New",monospace;font-size:16px;font-weight:700;
  color:var(--seal);margin:4px 0 8px;letter-spacing:.02em;
}

/* ── controls ── */
.ctl{margin:18px 0}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px}
.ctl-label{font-size:14px;font-weight:700;letter-spacing:.03em}
.ctl-val{font-family:"Courier New",monospace;font-size:20px;font-weight:700;color:var(--seal);text-align:right;white-space:nowrap}
.ctl-val small{font-size:12px;color:var(--ink-soft);font-family:inherit}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--gold) var(--pct,50%),var(--parch-deep) var(--pct,50%));
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--ink);border:3px solid var(--gold-bright);cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:var(--ink);border:3px solid var(--gold-bright);cursor:pointer;
}
.ctl-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px}
.badge{
  display:inline-block;background:var(--bg-panel);color:var(--gold-bright);
  font-size:12.5px;padding:4px 12px;border-radius:3px;letter-spacing:.04em;margin:2px 6px 10px 0;
}
.badge.warn{background:var(--seal);color:#fff}

/* ── intel panel ── */
.intel{
  background:#fffdf6;border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:4px;padding:14px 18px;margin:14px 0 4px;
}
.intel-title{font-size:11.5px;letter-spacing:.18em;color:#8a6516;font-weight:700;margin-bottom:8px}
.intel-row{font-size:14px;margin:6px 0;color:var(--ink);line-height:1.65}
.intel-row b{font-family:"Courier New",monospace;font-size:17px;color:var(--seal)}
.intel-note{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.65;border-top:1px dashed var(--line);padding-top:8px}
.itable{border-collapse:collapse;margin:6px 0;font-size:12.5px}
.itable td,.itable th{border:1px solid var(--line);padding:4px 9px;text-align:center;font-family:"Courier New",monospace}
.itable th{background:var(--parch-deep);font-family:inherit;font-weight:700}

/* ── buttons ── */
.btnrow{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
button.main,button.ghost{
  font-family:inherit;font-size:15px;letter-spacing:.06em;font-weight:700;
  padding:13px 26px;border-radius:3px;cursor:pointer;transition:transform .12s, box-shadow .12s;
}
button.main{
  background:var(--ink);color:var(--gold-bright);border:1px solid var(--gold);
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
button.main:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--ink-soft)}

/* ── ledger feedback ── */
.ledger{
  background:#fffdf6;border:1px solid var(--line);border-radius:4px;
  padding:20px 22px 16px;margin:14px 0 6px;position:relative;overflow:hidden;
}
.ledger-title{
  font-size:11.5px;letter-spacing:.2em;color:var(--ink-soft);font-weight:700;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;
  padding-right:78px;text-transform:uppercase;
}
.lrow{margin-bottom:14px}
.ledger-title + .lrow .lrow-head{padding-right:74px}
.lrow-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:12px}
.lrow-head .k{font-weight:700;letter-spacing:.02em}
.lrow-head .v{font-family:"Courier New",monospace;font-weight:700;text-align:right;white-space:nowrap}
.v .opt{color:var(--ink-soft);font-weight:400;font-size:12.5px}
.bars{position:relative;height:14px;background:var(--parch-deep);border-radius:2px;overflow:hidden}
.bar-opt{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#d8c795 0 6px,#e4d6ac 6px 12px);width:0;transition:width .8s ease}
.bar-you{position:absolute;inset:0;background:var(--leaf);width:0;transition:width 1.1s cubic-bezier(.2,.8,.3,1)}
.bar-you.over{background:var(--seal)}
.hintline{
  font-size:13.5px;color:var(--seal);margin-top:12px;line-height:1.65;
  border-top:1px dashed var(--line);padding-top:12px;
}
.stamp{
  position:absolute;right:18px;top:14px;width:64px;height:64px;border-radius:50%;
  border:3px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;font-family:"Iowan Old Style",Georgia,serif;
  transform:rotate(-12deg) scale(0);opacity:.88;
  animation:stampIn .5s .9s cubic-bezier(.3,1.6,.4,1) forwards;
  background:radial-gradient(circle,#b23a2c11 60%, transparent 62%);
}
@keyframes stampIn{to{transform:rotate(-12deg) scale(1)}}
.stamp.good{border-color:var(--leaf);color:var(--leaf)}
.stamp.mid{border-color:var(--gold);color:#8a6516}

.whybtn{
  background:none;border:none;color:var(--seal);font-size:13px;cursor:pointer;
  text-decoration:underline dotted;letter-spacing:.02em;padding:0;font-family:inherit;
  margin-top:10px;
}
.whybox{display:none;margin-top:10px;font-size:13.5px;color:var(--ink-soft);line-height:1.7;
  background:#fdf8ec;border:1px dashed var(--gold);border-radius:3px;padding:12px 14px}
.whybox.show{display:block}

/* ── collapse / negotiation ── */
.card.crisis{background:#f0dcd2}
.card.crisis::before{border-color:#c9a08f}
.crisis .eyebrow{color:var(--seal)}
.resp{display:flex;gap:12px;align-items:center;margin:10px 0;font-size:14px}
.resp .avatar{width:40px;height:40px;flex-basis:40px;font-size:15px}
.resp .say{background:#fffdf6;border:1px solid var(--line);border-radius:4px;padding:8px 14px;flex:1}
.ok{color:var(--leaf);font-weight:700}
.no{color:var(--seal);font-weight:700}

.qtable{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}
.qtable th,.qtable td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.qtable th{background:var(--parch-deep);letter-spacing:.04em}
.qtable td.me{font-weight:700;color:var(--seal)}

.progress-dots{display:flex;gap:6px;margin:4px 0 14px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--parch-deep);border:1px solid var(--line)}
.pdot.done{background:var(--leaf);border-color:var(--leaf)}
.pdot.cur{background:var(--gold);border-color:var(--gold);transform:scale(1.3)}

/* ── svg anims ── */
@keyframes fadeOutUp{0%,35%{opacity:1;transform:none}60%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes priceRise{0%,15%{transform:translateY(0)}70%,100%{transform:translateY(-46px)}}
@keyframes shrink{from{transform:scale(1)}to{transform:scale(.45)}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes rollHill{0%{transform:translate(0,0)}100%{transform:translate(78px,-44px)}}
@keyframes walkRight{0%,20%{transform:translateX(0);opacity:1}80%,100%{transform:translateX(72px);opacity:1}}
@keyframes tipScale{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-7deg)}}
@keyframes swim{0%{transform:translateX(0)}50%{transform:translateX(14px)}100%{transform:translateX(0)}}
@keyframes fadeAway{0%,40%{opacity:1}90%,100%{opacity:0}}
@keyframes blinkCell{0%,45%{opacity:0}65%,100%{opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes barDown{0%,20%{height:52px;y:38px}90%,100%{height:14px;y:76px}}
@keyframes growBack{0%,30%{width:30px}90%,100%{width:110px}}
.aa{animation-duration:3.4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

@media (max-width:560px){
  .card{padding:22px 18px 22px}
  h1{font-size:30px}
  .stamp{width:52px;height:52px;font-size:24px;right:12px;top:10px}
  .ledger-title{padding-right:62px}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand serif" onclick="screenTitle()" style="cursor:pointer" title="Back to level select">ECONQUEST</div>
  <div class="meta" id="topmeta"></div>
</div>
<div id="stage"></div>

<script>
/* ═══════════════════ DATA & MODEL ═══════════════════ */

const OUT=[0,4,8,11,14,16,18,19,20,20,20];           // workers → output (diminishing returns)
const WTP=[27,25,24,22,21,20,19,18,17,16,15,14,13,12,11,10,9,8,7,6]; // buyers' willingness to pay
const demand=P=>WTP.filter(w=>w>=P).length;

const L1CFG=[
 {cap:12},{cap:15},
 {workers:1},{workers:1},{workers:1},{workers:1},
 {workers:1,comp:12},{workers:1,comp:10}
];
function simL1(r,P,W){
  const c=L1CFG[r-1];
  P=Math.max(5,Math.min(28,P));W=Math.max(0,Math.min(10,W||0));
  let d=demand(P);
  if(c.comp&&P>c.comp)d=Math.floor(d*0.15);
  const cap=c.workers?OUT[W]:c.cap;
  const sold=Math.min(d,cap);
  const profit=c.workers? sold*P-2*sold-8*W : sold*(P-4);
  return{sold,profit,cap,d};
}
function optL1(r){
  const c=L1CFG[r-1];let best={profit:-1e9};
  for(let P=5;P<=28;P++){
    if(c.workers){for(let W=0;W<=10;W++){const s=simL1(r,P,W);if(s.profit>best.profit)best={...s,P,W}}}
    else{const s=simL1(r,P,0);if(s.profit>best.profit)best={...s,P,W:0}}
  }
  return best;
}

const EFF=[1,.93,.86,.79], SAT=[82,68,55,43];
function simL2A(r,F){
  const e=EFF[r-1];
  const g=1.2*F*e, c=.5*(100-F)*e;
  let w=Math.round(100*Math.min(g/90,c/12));
  w-=Math.round(.15*(Math.max(0,g-90)+3*Math.max(0,c-12)));
  return{g:+g.toFixed(1),c:+c.toFixed(1),welfare:Math.max(0,Math.min(100,w))};
}
function optL2A(r){let b={welfare:-1};for(let F=0;F<=100;F++){const s=simL2A(r,F);if(s.welfare>b.welfare)b={...s,F}}return b}

function simL2B(r,p,T){
  T=T||0;
  const s=Math.min(.7,Math.max(.02,.25*Math.pow(p/2.4,2)));
  const Ww=100*s;
  let g=1.2*(100-Ww), c=.5*Ww;
  const Dc=12*Math.pow(2.4/p,.8);
  g-=1.6*T; c+=T;
  const sg=g-90, sc=c-Dc;
  let w=100-1.0*Math.abs(sg)-4*Math.abs(sc);
  if(r>=7&&sc>=-1) w+=.8*T;                 // gains from trade
  w=Math.max(0,Math.min(112,Math.round(w)));
  return{g:+g.toFixed(1),c:+c.toFixed(1),Dc:+Dc.toFixed(1),sg:+sg.toFixed(1),sc:+sc.toFixed(1),welfare:w,weavers:Math.round(Ww)};
}
function optL2B(r){
  let b={welfare:-1};
  for(let p=1.2;p<=4.001;p+=.05){
    if(r>=7){for(let T=0;T<=10;T++){const s=simL2B(r,p,T);if(s.welfare>b.welfare)b={...s,p:+p.toFixed(2),T}}}
    else{const s=simL2B(r,p,0);if(s.welfare>b.welfare)b={...s,p:+p.toFixed(2),T:0}}
  }
  return b;
}

const growth=S=>.35*S*(1-S/600);
const fairShare=S=>Math.max(4,Math.round(growth(S)/3));
function aiQuotas(r,S,treaty){
  if(treaty)return[Math.min(treaty,16),Math.min(treaty,18)];
  if(r<=2)return[20,22];
  if(r<=4)return S>400?[24,24]:[26,25];
  return[26,28];
}
function stepL3(S,q,a1,a2){
  let tot=q+a1+a2;
  const avail=Math.max(0,.5*S);
  let scale=tot>avail?avail/tot:1;
  const cq=Math.round(q*scale),c1=Math.round(a1*scale),c2=Math.round(a2*scale);
  const S2=Math.max(0,Math.round(S+growth(S)-(cq+c1+c2)));
  return{S2,cq,c1,c2};
}

/* ═══════════════════ BRIEFINGS (NPC + animation + formula) ═══════════════════ */

const NPCS={mira:{n:"MIRA · TRAVELLING MERCHANT",a:"M"},cai:{n:"ELDER CAI · VILLAGE FOUNDER",a:"C"},rena:{n:"CAPTAIN RENA · RIVER WARDEN",a:"R"}};

function svgDemand(){return `<svg width="300" height="150" viewBox="0 0 300 150">
<line x1="36" y1="126" x2="284" y2="126" stroke="#5a4c38" stroke-width="1.5"/>
<line x1="36" y1="126" x2="36" y2="14" stroke="#5a4c38" stroke-width="1.5"/>
<text x="288" y="140" font-size="10" fill="#5a4c38" text-anchor="end">Quantity Q</text>
<text x="10" y="14" font-size="10" fill="#5a4c38">Price P</text>
<line x1="46" y1="26" x2="266" y2="116" stroke="#b23a2c" stroke-width="2.5"/>
<g class="aa" style="animation-name:priceRise">
 <line x1="36" y1="96" x2="280" y2="96" stroke="#c7973b" stroke-width="2" stroke-dasharray="5 4"/>
 <text x="234" y="90" font-size="10" fill="#8a6516" font-weight="bold">your price</text>
</g>
${[0,1,2,3,4].map(i=>`<g class="aa" style="animation-name:fadeOutUp;animation-delay:${.5+i*.35}s">
  <circle cx="${70+i*38}" cy="${112-i*16}" r="7" fill="#20180f"/>
  <circle cx="${70+i*38}" cy="${94-i*16}" r="5" fill="#c7973b"/></g>`).join("")}
</svg>`}

function svgMC(){return `<svg width="300" height="150" viewBox="0 0 300 150">
<line x1="20" y1="128" x2="290" y2="128" stroke="#5a4c38" stroke-width="1.5"/>
${[0,1,2,3].map(i=>{const s=1-.22*i;return `
<g class="aa" style="animation-name:popIn;animation-delay:${.4+i*.6}s;animation-fill-mode:both;animation-iteration-count:1">
 <circle cx="${58+i*62}" cy="102" r="11" fill="#20180f"/>
 <rect x="${50+i*62}" y="114" width="16" height="14" rx="2" fill="#20180f"/>
 <g transform="translate(${58+i*62},72) scale(${s})">
   <path d="M-13 12 Q-13 -8 0 -12 Q13 -8 13 12 Z" fill="#c7973b" stroke="#8a6516"/>
   <text y="8" font-size="12" text-anchor="middle" fill="#20180f" font-weight="bold">G</text>
 </g>
 <text x="${58+i*62}" y="146" font-size="10" text-anchor="middle" fill="#5a4c38">worker ${i+1}</text>
</g>`}).join("")}
<text x="150" y="20" font-size="11" fill="#b23a2c" text-anchor="middle">Each extra worker adds less than the last</text>
</svg>`}

function svgHill(){return `<svg width="300" height="150" viewBox="0 0 300 150">
<line x1="20" y1="130" x2="290" y2="130" stroke="#5a4c38" stroke-width="1.5"/>
<path d="M40 122 Q150 6 262 122" fill="none" stroke="#b23a2c" stroke-width="2.5"/>
<circle r="8" fill="#c7973b" stroke="#8a6516" stroke-width="2" cx="66" cy="106" class="aa" style="animation-name:rollHill"/>
<line x1="150" y1="64" x2="150" y2="130" stroke="#c7973b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="150" y="146" font-size="10" fill="#8a6516" text-anchor="middle" font-weight="bold">optimum</text>
<text x="40" y="146" font-size="10" fill="#5a4c38">too low</text>
<text x="262" y="146" font-size="10" fill="#5a4c38" text-anchor="end">too high</text>
<text x="150" y="26" font-size="11" fill="#5a4c38" text-anchor="middle">Profit</text>
</svg>`}

function svgComp(){return `<svg width="300" height="150" viewBox="0 0 300 150">
<g><rect x="30" y="46" width="72" height="62" rx="4" fill="#20180f"/><path d="M24 46 L66 20 L108 46 Z" fill="#b23a2c"/>
<text x="66" y="82" font-size="13" fill="#e0b45c" text-anchor="middle" font-weight="bold">YOU</text>
<rect x="42" y="112" width="48" height="18" rx="2" fill="#fffdf6" stroke="#b23a2c"/><text x="66" y="125" font-size="11" text-anchor="middle" fill="#b23a2c" font-weight="bold">18 g</text></g>

const SNAP_FIELDS=["level","round","gold","welfare","fish","fishHist","cumCatch","quotaHist","treaty","negoTried","negoDone","ratings"];
function snapshot(){
  const s={};SNAP_FIELDS.forEach(k=>s[k]=G[k]);
  G.snaps[G.level+"-"+G.round]=JSON.parse(JSON.stringify(s));
}
function restoreTo(lv,r){
  const s=G.snaps[lv+"-"+r];if(!s)return false;
  Object.assign(G,JSON.parse(JSON.stringify(s)));
  return true;
}
function backRound(){
  if(G.round>1&&restoreTo(G.level,G.round-1))screenTip();
  else screenTitle();
}

  if(G.screen==="title"){topmeta.innerHTML="";return}

  if(G.level===1)res=`Vault <b>${G.gold}</b> gold`;
  if(G.level===2)res=G.welfare==null?`Villagers <b>100</b>`:`Welfare <b>${G.welfare}</b>`;
  if(G.level===3)res=`Stock <b>${G.fish}</b> / 500`;
  topmeta.innerHTML=`<span>${LEVEL_NAMES[G.level]}</span><span>Round <b>${G.round}</b> / 8</span><span>${res}</span>`;

  let s='<div class="progress-dots">';

  return s+"</div>";
}

function bindSlider(id,fmt){
  const el=document.getElementById(id),out=document.getElementById(id+"-v");
  const upd=()=>{
    const p=(el.value-el.min)/(el.max-el.min)*100;
    el.style.setProperty("--pct",p+"%");
    out.innerHTML=fmt(el.value);
  };
  el.addEventListener("input",upd);upd();
}

        <div style="font-size:13px;color:var(--seal);font-weight:700">${l.q}</div>
      </div>
      <button class="main" onclick="startLevel(${l.n})">Enter</button>
    </div>`).join("");
  show(`<div class="card" style="text-align:center;padding:44px 34px">
    <div class="eyebrow">ECONQUEST · PLAYABLE DEMO</div>
    <h1 class="serif" style="font-size:52px">EconQuest</h1>
    <p class="dim" style="margin:8px auto 22px;max-width:470px">You are a founder setting foot on an uncharted continent. From a single workshop, to a village, to a river shared with strangers — every decision is a lesson in economics.<br>Playing in order is recommended, but you may begin at any level.</p>
    ${cards}
    <p class="dim" style="margin-top:18px;font-size:12px">You can return to any earlier round at any time to relearn and redecide · no permanent failure</p>
  </div>`);
}

/* ── level intro ── */
const INTROS={
 1:{t:"The Workshop",p:"The sea wind is salt-sharp, and the first cook-smoke rises over the new settlement. You set up your anvil and hammer out the first batch of tools — the only such trade in the village.<br><br>No rivals. No rules. The price is yours to set.<br>— but the villagers' purses are not.",q:"Core question: How do I make the most profit?"},
 2:{t:"The Village",p:"A few years on, a hundred people have gathered around the workshop. Farmers, weavers, smiths — and every one of them looks to you to decide.<br><br>You are the chief now. But a hundred livelihoods are far harder to reckon than one shop's books.",q:"Core question: How do we coordinate production and exchange?"},
 3:{t:"The River",p:"The village grew along the river, and two more have since settled upstream. The fish feed all three — but the river belongs to no one.<br><br>Captain Rena has patrolled this water for thirty years. She says she has seen a river run empty.",q:"Core question: What happens when everyone acts in their own interest?"},
};
function startLevel(lv){
  G.level=lv;G.round=1;G.treaty=null;G.negoTried=0;G.negoDone=false;G.ratings=[];
  Object.keys(G.snaps).forEach(k=>{if(k.startsWith(lv+"-"))delete G.snaps[k]});
  if(lv===1)G.gold=40;
  if(lv===2)G.welfare=null;
  if(lv===3){G.fish=500;G.fishHist=[500];G.cumCatch={me:0,a:0,b:0};G.quotaHist=[]}
  const I=INTROS[lv];G.screen="intro";
  show(`<div class="card">
    <div class="eyebrow">LEVEL ${lv}</div>
    <h1 class="serif">${I.t}</h1>
    <p style="margin:14px 0">${I.p}</p>
    <p style="font-weight:700;color:var(--seal)">${I.q}</p>
    <div class="btnrow"><button class="main" onclick="screenTip()">Begin round 1</button></div>
  </div>`);
}

/* ── briefing (NPC + animation) ── */
function screenTip(){
  G.screen="tip";snapshot();
  const tip=TIPS[G.level][G.round-1];
  const npc=NPCS[tip.npc];
  show(`<div class="card">
    <div class="eyebrow">ROUND ${G.round} · WATCH</div>
    ${dots()}
    <div class="npc-row">
      <div class="avatar serif">${npc.a}</div>
      <div class="bubble"><div class="npc-name">${npc.n}</div><p>${tip.t}</p></div>
    </div>
    <div class="animbox">${tip.anim()}</div>
    <div class="anim-cap">${tip.cap}</div>
    <details class="formula"><summary>Math shortcut (optional)</summary>
      <div class="fbody"><div class="expr">${tip.f.e}</div><p class="dim">${tip.f.n}</p></div>
    </details>
    <div class="btnrow"><button class="main" onclick="screenDecide()">To the decision</button>
      <button class="ghost" onclick="backRound()">${G.round>1?"← Previous round":"← Level select"}</button></div>
  </div>`);
}

/* ── decision ── */
function screenDecide(){
  G.screen="decide";
  const r=G.round,lv=G.level;
  let inner="",badges="",intel="",wire=()=>{};
  if(lv===1){
    const cfg=L1CFG[r-1];
    if(cfg.comp)badges=`<span class="badge warn">Rival's price: ${cfg.comp} gold</span>`;
    if(!cfg.workers)badges+=`<span class="badge">Shelf capacity: ${cfg.cap} pieces</span><span class="badge">Materials: 4 gold/piece</span>`;
    else badges+=`<span class="badge">Wages: 8 gold/worker</span><span class="badge">Materials: 2 gold/piece</span>`;
    inner=`<div class="ctl"><div class="ctl-head"><span class="ctl-label">Selling price</span><span class="ctl-val" id="p-v"></span></div>
      <input type="range" id="p" min="5" max="28" value="16" step="1">
      <div class="ctl-scale"><span>5 gold</span><span>28 gold</span></div></div>`;
    if(cfg.workers)inner+=`<div class="ctl"><div class="ctl-head"><span class="ctl-label">Workers hired</span><span class="ctl-val" id="w-v"></span></div>
      <input type="range" id="w" min="0" max="10" value="4" step="1">
      <div class="ctl-scale"><span>0</span><span>10</span></div></div>`;
    intel=`<div class="intel"><div class="intel-title">MIRA'S MARKET SURVEY</div>
      <div class="intel-row">At this price, buyers willing to purchase: <b id="iq">—</b>${cfg.comp?`<span id="icomp" style="color:var(--seal);font-size:12.5px"></span>`:""}</div>
      ${cfg.workers?`<div class="intel-row">At this headcount, workshop output: <b id="io">—</b> pieces</div>`:""}
      <div class="intel-note">Units sold = the smaller of demand and ${cfg.workers?"output":"shelf capacity"} · Profit = units sold × (price − materials)${cfg.workers?" − total wages":""}. Do the arithmetic or don't — but the numbers are right here.</div></div>`;
    wire=()=>{
      const upd=()=>{
        const P=+document.getElementById("p").value;
        const W=document.getElementById("w")?+document.getElementById("w").value:0;
        let d=demand(P),note="";
        if(cfg.comp&&P>cfg.comp){d=Math.floor(d*0.15);note=`  ⚠ above the rival — most buyers go to him`;}
        document.getElementById("iq").textContent=d;
        if(cfg.comp)document.getElementById("icomp").textContent=note;
        if(cfg.workers)document.getElementById("io").textContent=OUT[W];
      };
      document.getElementById("p").addEventListener("input",upd);
      if(document.getElementById("w"))document.getElementById("w").addEventListener("input",upd);
      upd();
    };
  }
  if(lv===2&&r<=4){
    badges=`<span class="badge">Villager satisfaction ${SAT[r-1]} / 100</span><span class="badge">Needs: 90 grain · 12 cloth</span>`;
    inner=`<div class="ctl"><div class="ctl-head"><span class="ctl-label">Villagers assigned to farming</span><span class="ctl-val" id="f-v"></span></div>
      <input type="range" id="f" min="0" max="100" value="50" step="5">
      <div class="ctl-scale"><span>all weaving</span><span>all farming</span></div></div>`;
    intel=`<div class="intel"><div class="intel-title">THE CHIEF'S LEDGER</div>
      <div class="intel-row">On paper: grain <b id="ig">—</b> sacks · cloth <b id="ic">—</b> bolts</div>
      <div class="intel-note">Per head: 1.2 sacks farming · 0.5 bolts weaving.${r===1?"":" — but a ledger is a ledger and hearts are hearts. Lately the real harvest keeps coming in under the paper."}</div></div>`;
    wire=()=>{
      const upd=()=>{
        const F=+document.getElementById("f").value;
        document.getElementById("ig").textContent=(1.2*F).toFixed(0);
        document.getElementById("ic").textContent=(.5*(100-F)).toFixed(1);
      };
      document.getElementById("f").addEventListener("input",upd);upd();
    };
  }
  if(lv===2&&r>=5){
    badges=`<span class="badge">Demand: 90 sacks of grain (steady)</span>`;
    if(r>=7)badges+=`<span class="badge" style="background:var(--leaf)">Neighbors offer: 1 bolt = 1.6 sacks</span>`;
    inner=`<div class="ctl"><div class="ctl-head"><span class="ctl-label">Cloth price (1 bolt = ? sacks of grain)</span><span class="ctl-val" id="p2-v"></span></div>
      <input type="range" id="p2" min="1.2" max="4" value="2.0" step="0.05">
      <div class="ctl-scale"><span>1.2</span><span>4.0</span></div></div>`;
    if(r>=7)inner+=`<div class="ctl"><div class="ctl-head"><span class="ctl-label">Bolts bought from the neighbors</span><span class="ctl-val" id="t-v"></span></div>
      <input type="range" id="t" min="0" max="10" value="0" step="1">
      <div class="ctl-scale"><span>no trade</span><span>10 bolts</span></div></div>`;
    intel=`<div class="intel"><div class="intel-title">ELDER CAI'S OBSERVATIONS</div>
      <div class="intel-row">At this price about <b id="iw">—</b> villagers weave → cloth supply ≈ <b id="ics">—</b> bolts · grain supply ≈ <b id="igs">—</b> sacks</div>
      <div class="intel-row">At this price villagers want about <b id="idc">—</b> bolts (the higher the price, the less they want)</div>
      ${r>=7?`<div class="intel-row">After trade: cloth <b id="itc">—</b> bolts · grain <b id="itg">—</b> sacks (1.6 sacks paid per bolt)</div>`:""}
      <div class="intel-note">Higher price → more weavers and fewer buyers; lower price, the reverse. Get supply to meet demand and both markets settle.</div></div>`;
    wire=()=>{
      const upd=()=>{
        const p=+document.getElementById("p2").value;
        const T=document.getElementById("t")?+document.getElementById("t").value:0;
        const s=Math.min(.7,Math.max(.02,.25*Math.pow(p/2.4,2)));
        const Ww=100*s,g=1.2*(100-Ww),c=.5*Ww,Dc=12*Math.pow(2.4/p,.8);
        document.getElementById("iw").textContent=Math.round(Ww);
        document.getElementById("ics").textContent=c.toFixed(1);
        document.getElementById("igs").textContent=g.toFixed(0);
        document.getElementById("idc").textContent=Dc.toFixed(1);
        if(r>=7){
          document.getElementById("itc").textContent=(c+T).toFixed(1);
          document.getElementById("itg").textContent=(g-1.6*T).toFixed(0);
        }
      };
      document.getElementById("p2").addEventListener("input",upd);
      if(document.getElementById("t"))document.getElementById("t").addEventListener("input",upd);
      upd();
    };
  }
  if(lv===3){
    const cap=G.treaty?Math.min(30,G.treaty):30;
    badges=`<span class="badge">Stock ${G.fish} / 500</span><span class="badge">Growth this round ≈ ${Math.round(growth(G.fish))} fish</span>`;
    if(G.treaty)badges+=`<span class="badge" style="background:var(--leaf)">Treaty cap: ${G.treaty} fish/village</span>`;
    inner=`<div class="ctl"><div class="ctl-head"><span class="ctl-label">Your village's fishing quota</span><span class="ctl-val" id="q-v"></span></div>
      <input type="range" id="q" min="0" max="${cap}" value="${Math.min(15,cap)}" step="1">
      <div class="ctl-scale"><span>0</span><span>${cap}</span></div></div>`;
    const hist=G.quotaHist.slice(-4);
    const histRows=hist.length
      ?hist.map(h=>`<tr><td>${h.r}</td><td>${h.a}</td><td>${h.b}</td><td>${h.S}</td></tr>`).join("")
      :`<tr><td colspan="4" style="font-family:inherit">No records yet · by eye, each fleet looks 20+ strong</td></tr>`;
    intel=`<div class="intel"><div class="intel-title">RENA'S WATCH LOG</div>
      <div class="intel-row">Sustainable total for three villages ≈ this round's growth (${Math.round(growth(G.fish))} fish) → fair share ≈ <b>${fairShare(G.fish)}</b> per village</div>
      <table class="itable"><tr><th>Round</th><th>Village I</th><th>Village II</th><th>Stock at end</th></tr>${histRows}</table>
      <div class="intel-note">${G.treaty?"Treaty in force — each village fishes to the cap.":"You can only guess the upstream villages' plans from the record. That is the game: your best move depends on theirs."}</div></div>`;
  }
  show(`<div class="card">
    <div class="eyebrow">ROUND ${G.round} · DECIDE</div>
    ${dots()}
    <div style="margin-bottom:6px">${badges}</div>
    ${intel}
    ${inner}
    <p class="dim" style="margin-top:4px">You have the intelligence; the commitment is yours. Nothing is revealed until you settle.</p>
    <div class="btnrow"><button class="main" onclick="resolve()">Settle the round</button>
      <button class="ghost" onclick="screenTip()">← Replay the briefing</button></div>
  </div>`);
  if(document.getElementById("p"))bindSlider("p",v=>`${v} <small>gold</small>`);
  if(document.getElementById("w"))bindSlider("w",v=>`${v} <small>workers</small>`);
  if(document.getElementById("f"))bindSlider("f",v=>`${v} <small>farm · ${100-v} weave</small>`);
  if(document.getElementById("p2"))bindSlider("p2",v=>`${(+v).toFixed(2)} <small>sacks</small>`);
  if(document.getElementById("t"))bindSlider("t",v=>`${v} <small>bolts</small>`);
  if(document.getElementById("q"))bindSlider("q",v=>`${v} <small>fish</small>`);
  wire();
}

/* ── settlement ── */
function resolve(){
  const lv=G.level,r=G.round;
  if(lv===1){
    const P=+document.getElementById("p").value;
    const W=document.getElementById("w")?+document.getElementById("w").value:0;
    const res=simL1(r,P,W),opt=optL1(r);
    G.gold+=res.profit;
    G.lastDecision={P,W};G.lastResult={res,opt};
    if(G.gold<0)return screenCollapse("The vault is empty. Round after round of losses has drained your savings — the workers have scattered and the workshop stands shut.","Last round's combination of price and output ran at a loss. Return to the checkpoint and try another.");
  }
  if(lv===2&&r<=4){
    const F=+document.getElementById("f").value;
    const res=simL2A(r,F),opt=optL2A(r);
    G.welfare=res.welfare;
    G.lastDecision={F};G.lastResult={res,opt};
    if(res.welfare<25)return screenCollapse("The granary and the cloth store are badly out of balance, and the complaints are loud — this will be a hard winter.","Your allocation is far from what the village needs (90 grain · 12 cloth). Return to the checkpoint and weigh it again.");
  }
  if(lv===2&&r>=5){
    const p=+document.getElementById("p2").value;
    const T=document.getElementById("t")?+document.getElementById("t").value:0;
    const res=simL2B(r,p,T),opt=optL2B(r);
    G.welfare=res.welfare;
    G.lastDecision={p,T};G.lastResult={res,opt};
    if(res.welfare<25)return screenCollapse("Prices are badly distorted and the market has seized up — cloth piles up unsold while nobody will part with grain.","Both the surplus and the shortage are far too large. Return to the checkpoint and move the price closer to where both markets clear at once.");
  }
  if(lv===3){
    const q=+document.getElementById("q").value;
    const[a1,a2]=aiQuotas(r,G.fish,G.treaty);
    const st=stepL3(G.fish,q,a1,a2);
    G.cumCatch.me+=st.cq;G.cumCatch.a+=st.c1;G.cumCatch.b+=st.c2;
    G.quotaHist.push({r,me:q,a:a1,b:a2,S:st.S2});
    const prev=G.fish;G.fish=st.S2;G.fishHist.push(st.S2);
    G.lastDecision={q};G.lastResult={st,prev,a1,a2,fair:fairShare(prev)};
  }
  screenFeedback();
}

/* ── feedback ledger ── */
function lrow(k,you,opt,unit,over){
  const max=Math.max(you,opt,1);
  const wy=Math.min(100,you/max*100),wo=Math.min(100,opt/max*100);
  return`<div class="lrow"><div class="lrow-head"><span class="k">${k}</span>
    <span class="v">${you} <span class="opt">/ optimal ${opt} ${unit}</span></span></div>
    <div class="bars"><div class="bar-opt" style="width:0" data-w="${wo}"></div>
    <div class="bar-you ${over?"over":""}" style="width:0" data-w="${wy}"></div></div></div>`;
}
function stampFor(ratio){
  if(ratio>=.9)return`<div class="stamp good serif">A</div>`;
  if(ratio>=.65)return`<div class="stamp mid serif">B</div>`;
  return`<div class="stamp serif">C</div>`;
}
function screenFeedback(){
  G.screen="feedback";
  const lv=G.level,r=G.round;let rows="",hint="",why="",ratio=0;
  if(lv===1){
    const{res,opt}=G.lastResult,{P,W}=G.lastDecision;
    ratio=opt.profit>0?Math.max(0,res.profit/opt.profit):1;
    rows=lrow("Profit",res.profit,opt.profit,"gold",false)
        +lrow("Units sold",res.sold,opt.sold,"pieces",false);
    const dp=P-opt.P;
    hint=dp>1?`▲ Your price was ${dp} gold too high — some buyers walked away.`:dp<-1?`▼ Your price was ${-dp} gold too low — you sold more and earned less.`:`● Your price was close to optimal.`;
    if(L1CFG[r-1].workers){const dw=W-opt.W;
      if(dw>0)hint+=` ${dw} worker(s) too many: the extra wages cost more than the extra output was worth.`;
      if(dw<0)hint+=` ${-dw} worker(s) too few: there was still profitable capacity going unused.`;}
    why=`This round's optimum: price <b>${opt.P} gold</b>${L1CFG[r-1].workers?`, <b>${opt.W} worker(s)</b>`:""}, for a profit of ${opt.profit} gold.`+
      (L1CFG[r-1].comp?` Under competition the optimum is pinned down by your rival's ${L1CFG[r-1].comp} gold — that is what losing pricing power looks like.`:` Along the demand curve, every notch of price costs you a few buyers; the optimum is where "earning more per sale" and "losing customers" exactly cancel out.`);
  }
  if(lv===2&&r<=4){
    const{res,opt}=G.lastResult,{F}=G.lastDecision;
    ratio=res.welfare/Math.max(1,opt.welfare);
    rows=lrow("Village welfare",res.welfare,opt.welfare,"",false)
        +lrow("Grain output",res.g,90,"sacks needed",res.g>90*1.2)
        +lrow("Cloth output",res.c,12,"bolts needed",res.c>12*1.2);
    const df=F-opt.F;
    hint=df>3?`▲ ${df} too many in the fields — cloth runs short while grain sits rotting.`:df<-3?`▼ ${-df} too many at the looms — cloth to spare, and empty stomachs.`:`● Your allocation was close to optimal.`;
    if(r>=2)hint+=` Note: efficiency is down to ${Math.round(EFF[r-1]*100)}% — the same allocation now yields less.`;
    why=`This round's optimum: about <b>${opt.F} farming and ${100-opt.F} weaving</b> (welfare ${opt.welfare}). With demand at 90 grain and 12 cloth, the best split minimises both shortfalls at once.${r>=3?" But no allocation can recover what compulsion costs in efficiency — the problem is not the ratio, it is the system.":""}`;
  }
  if(lv===2&&r>=5){
    const{res,opt}=G.lastResult,{p,T}=G.lastDecision;
    ratio=res.welfare/Math.max(1,opt.welfare);
    rows=lrow("Village welfare",res.welfare,opt.welfare,"",false);
    rows+=`<div class="lrow"><div class="lrow-head"><span class="k">Grain market</span>
      <span class="v" style="color:${Math.abs(res.sg)<3?"var(--leaf)":"var(--seal)"}">${res.sg>0?"surplus +":"shortage "}${res.sg}</span></div></div>`;
    rows+=`<div class="lrow"><div class="lrow-head"><span class="k">Cloth market</span>
      <span class="v" style="color:${Math.abs(res.sc)<1.5?"var(--leaf)":"var(--seal)"}">${res.sc>0?"surplus +":"shortage "}${res.sc}</span></div></div>`;
    const dp=p-opt.p;
    hint=dp>0.15?`▲ Cloth is priced too high — too many at the looms, too few in the fields.`:dp<-0.15?`▼ Cloth is priced too low — cloth runs short while everyone crowds into the fields.`:`● The price is near equilibrium; the market settles itself.`;
    if(r>=7&&T<opt.T)hint+=` The neighbors' price (1.6) is below what it costs you to make it (2.4) — buying more is pure gain.`;
    if(r>=7&&res.welfare>100)hint+=` ★ Welfare above 100: that part comes from trade, and self-sufficiency can never reach it.`;
    why=`The best cloth price is about <b>${opt.p}</b>${r>=7?`, buying <b>${opt.T} bolts</b>`:""} (welfare ${opt.welfare}). Price is a signal: a surplus calls for a cut, a shortage for a rise. ${r>=7?"The secret of trade is comparative advantage: each side specialises in what it does best, and at the right ratio both villages end up richer.":"You set a single number, and a hundred people sorted themselves out — that is what a price does."}`;
  }
  if(lv===3){
    const{st,prev,a1,a2,fair}=G.lastResult,{q}=G.lastDecision;
    ratio=1-Math.min(1,Math.abs(q-fair)/Math.max(fair,6));
    const drop=prev>0?Math.round((prev-G.fish)/prev*100):0;
    const toll=G.fish<prev?Math.max(1,Math.ceil((G.fish-290)/Math.max(1,prev-G.fish))):"—";
    rows=lrow("Fish stock",G.fish,500,"(threshold 300)",false)
        +lrow("Your catch",st.cq,fair,"fish (sustainable share)",q>fair);
    rows+=`<div class="lrow"><div class="lrow-head"><span class="k">Upstream villages' catch</span><span class="v">${st.c1} + ${st.c2} fish</span></div></div>`;
    rows+=`<div class="lrow"><div class="lrow-head"><span class="k">Cumulative catch, all three</span><span class="v">${G.cumCatch.me+G.cumCatch.a+G.cumCatch.b} fish</span></div></div>`;
    hint=G.fish<prev?`⚠ The stock fell ${drop}% this round${G.fish<380&&!G.treaty?`. At this rate it breaks the collapse threshold in about ${toll} rounds.`:"."}`:`✦ The stock has stopped falling — the treaty is working.`;
    if(q>fair)hint+=` Your quota exceeded the sustainable share by ${q-fair} fish.`;
    why=`Sustainable share = stock growth (about ${Math.round(growth(prev))} fish) ÷ 3 villages ≈ <b>${fair} fish</b>. Your restraint alone cannot save the river: the two villages upstream took ${st.c1+st.c2} this round. Individual rationality cannot stop a collective tragedy — there is only one way out, and that is for all three villages to stop at once (negotiation opens in round 7).`;
  }
  const stamp=stampFor(ratio);
  G.ratings.push(ratio);
  const nextLabel=r<8?"Next round":"Finish the level";
  show(`<div class="card">
    <div class="eyebrow">ROUND ${G.round} · REVIEW</div>
    ${dots()}
    <div class="ledger">${stamp}
      <div class="ledger-title">Feedback Ledger —${LEVEL_NAMES[lv].split("·")[1]}, Round ${r}</div>
      ${rows}
      <div class="hintline">${hint}</div>
      <button class="whybtn" onclick="this.nextElementSibling.classList.toggle('show')">Why wasn't this optimal?</button>
      <div class="whybox">${why}</div>
    </div>
    <div class="btnrow"><button class="main" onclick="nextRound()">${nextLabel}</button>
      <button class="ghost" onclick="restoreTo(G.level,G.round)&&screenTip()">↺ Redo this round</button></div>
  </div>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".bar-opt,.bar-you").forEach(b=>b.style.width=b.dataset.w+"%");
  }));
}

/* ── round advance ── */
function nextRound(){
  const lv=G.level;
  if(G.round>=8){
    if(lv<3)return screenTransition(lv);
    return screenEnding();
  }
  G.round++;
  if(lv===3&&G.round===7&&!G.negoDone)return screenNegotiate();
  if(lv===3&&G.round===8&&!G.treaty&&G.fish<300)return screenRiverCollapse();
  screenTip();
}

/* ── level transition ── */
function screenTransition(lv){
  const txt=lv===1
    ?{t:"After the Workshop",p:"Competition thinned your margins — and put cheap tools into every hand in the settlement. More people came; fields and looms spread out around the workshop.<br><br>Mira left you a parting question: <i>\"You can keep the books for one shop. What about a hundred people?\"</i>"}
    :{t:"After the Village",p:"The market began to run itself, and the road to the neighboring village opened. But prosperity drew new neighbors — two villages upstream, drinking from the same river.<br><br>Elder Cai watched the water: <i>\"The workshop was yours. The village is ours. And this river — whose is it?\"</i>"};
  show(`<div class="card">
    <div class="eyebrow">INTERLUDE</div>
    <h2 class="serif">${txt.t}</h2>
    <p style="margin:14px 0">${txt.p}</p>
    <div class="btnrow"><button class="main" onclick="startLevel(${lv+1})">Enter${LEVEL_NAMES[lv+1].split("·")[1]}</button></div>
  </div>`);
}

/* ── collapse (levels 1 & 2) ── */
function screenCollapse(title,advice){
  G.screen="collapse";
  show(`<div class="card crisis">
    <div class="eyebrow">ECONOMIC COLLAPSE</div>
    <h2 class="serif">Something Went Badly Wrong</h2>
    <p style="margin:12px 0">${title}</p>
    <p class="dim">${advice}</p>
    <div class="btnrow"><button class="main" onclick="restoreTo(G.level,G.round);screenTip()">Back to the checkpoint</button>
      ${G.round>1?`<button class="ghost" onclick="backRound()">← Previous round</button>`:""}</div>
  </div>`);
}

/* ── level 3 · negotiation ── */
function screenNegotiate(){
  G.screen="nego";G.negoDone=false;
  show(`<div class="card">
    <div class="eyebrow">ROUND 7 · TALKS AT THE BEND</div>
    ${dots()}
    <div class="npc-row">
      <div class="avatar serif">R</div>
      <div class="bubble"><div class="npc-name">${NPCS.rena.n}</div>
      <p>All three villages are here. Propose a per-village quota — too harsh and they walk out, too generous and the river dies anyway. You get one formal proposal. Think before you speak.</p></div>
    </div>
    <div class="animbox">${svgTreaty()}</div>
    <details class="formula"><summary>Math shortcut (optional)</summary>
      <div class="fbody"><div class="expr">Feasible range: village floor ≤ quota ≤ river ceiling</div>
      <p class="dim">Each village's floor is about 10 fish (below that they go hungry and will certainly refuse); the river's ceiling is about 14 (3 villages × 14 ≈ current growth — above that the stock keeps falling).</p></div>
    </details>
    <div class="ctl"><div class="ctl-head"><span class="ctl-label">Proposal: cap per village per round</span><span class="ctl-val" id="cap-v"></span></div>
      <input type="range" id="cap" min="6" max="24" value="15" step="1">
      <div class="ctl-scale"><span>6</span><span>24</span></div></div>
    <div class="btnrow">
      <button class="main" onclick="propose()">Make the proposal</button>
      <button class="ghost" onclick="G.negoDone=true;G.treaty=null;screenTip()">Walk away</button>
      <button class="ghost" onclick="backRound()">← Previous round</button>
    </div>
  </div>`);
  bindSlider("cap",v=>`${v} <small>fish</small>`);
}
function propose(){
  const cap=+document.getElementById("cap").value;
  G.negoDone=true;
  const accept=cap>=10;
  const sustainable=cap<=14;
  let resps=`
   <div class="resp"><div class="avatar serif">I</div><div class="say">Upstream Village I: ${accept?'<span class="ok">"...Fine. We\'ll sign."</span>':'<span class="no">"'+cap+' fish? You want us to live on air?"</span>'}</div></div>
   <div class="resp"><div class="avatar serif">II</div><div class="say">Upstream Village II: ${accept?'<span class="ok">"So long as everyone keeps to it."</span>':'<span class="no">"No deal."</span> (walks out)'}</div></div>
   <div class="resp"><div class="avatar serif">R</div><div class="say">Rena: ${accept?(sustainable?'<span class="ok">"That number... the river can carry it. Sign."</span>':'"Signed, yes. But I have counted — at that cap the stock is still falling."'):'"I told you. Too harsh, and they will not take it."'}</div></div>`;
  let after;
  if(accept){G.treaty=cap;after=`<div class="btnrow"><button class="main" onclick="screenTip()">Treaty in force · continue round 7</button></div>`}
  else{
    G.negoTried++;
    after=G.negoTried<2
      ?`<div class="btnrow"><button class="main" onclick="screenNegotiate()">Propose again (last chance)</button><button class="ghost" onclick="G.treaty=null;screenTip()">Walk away</button></div>`
      :`<p class="dim" style="margin-top:10px">The talks have broken down. Every village is on its own again.</p><div class="btnrow"><button class="main" onclick="G.treaty=null;screenTip()">Continue round 7</button></div>`;
  }
  show(`<div class="card">
    <div class="eyebrow">OUTCOME OF THE TALKS</div>
    <p style="margin-bottom:12px">You proposed: at most <b style="color:var(--seal)">${cap} fish</b> per village per round.</p>
    ${resps}${after}
  </div>`);
}

/* ── level 3 · total collapse ── */
function screenRiverCollapse(){
  G.screen="rivercollapse";
  let rowsHtml=G.quotaHist.map(h=>`<tr><td>${h.r}</td><td class="me">${h.me}</td><td>${h.a}</td><td>${h.b}</td><td>${h.S}</td></tr>`).join("");
  show(`<div class="card crisis">
    <div class="eyebrow">FISHERY COLLAPSE</div>
    <h2 class="serif">The River Is Empty</h2>
    <p style="margin:12px 0">The stock has fallen through the collapse threshold. At the start of round 8 all three villages haul in empty nets — <b>whatever anyone caught before this, everyone has lost.</b></p>
    <table class="qtable"><tr><th>Round</th><th>Your quota</th><th>Village I</th><th>Village II</th><th>Stock at end</th></tr>${rowsHtml}</table>
    <p class="dim">Look at the table. Taken on its own, every decision in every row was "rational". Put together, they are this empty river. That is how bad a Nash equilibrium can be.</p>
    <div class="btnrow"><button class="main" onclick="restoreTo(3,7);G.negoDone=false;G.negoTried=0;G.fish=Math.max(G.fish,320);screenNegotiate()">Back to the bend · reopen talks</button>
      <button class="ghost" onclick="backRound()">← Back to an earlier round</button></div>
  </div>`);
}

/* ── ending ── */
function screenEnding(){
  G.screen="end";
  const avg=G.ratings.length?G.ratings.reduce((a,b)=>a+b,0)/G.ratings.length:0;
  const grade=avg>=.85?"A":avg>=.6?"B":"C";
  const treatyLine=G.treaty
    ?(G.treaty<=14?`The three-village treaty (${G.treaty} fish each) turned the stock around — you found the way out of the dilemma: <b>turn a promise into an institution.</b>`
      :`A treaty was signed (${G.treaty} fish each), but the cap was too generous and the stock is still drifting down. You have the institution; it still needs calibration.`)
    :`With no treaty, the river came to the very edge of collapse. Individual restraint cannot save a commons — a lesson that came at no small price.`;
  show(`<div class="card">
    <div class="eyebrow">END OF DEMO</div>
    <h1 class="serif" style="font-size:36px">A Civilization Begins</h1>
    <p style="margin:12px 0">From the price of a single workshop, to the prices of a whole village, to the rules of a shared river — you have walked the three steps that matter most in economics: <b>how individuals decide, how markets coordinate, and how institutions make cooperation possible.</b></p>
    <p style="margin:12px 0">${treatyLine}</p>
    <div class="ledger" style="margin-top:18px">
      <div class="stamp ${avg>=.85?"good":avg>=.6?"mid":""} serif">${grade}</div>
      <div class="ledger-title">Founder's Record</div>
      <div class="lrow"><div class="lrow-head"><span class="k">How close your decisions were to optimal</span><span class="v">${Math.round(avg*100)} / 100</span></div>
      <div class="bars"><div class="bar-you" style="width:0" data-w="${Math.round(avg*100)}"></div></div></div>
      <div class="lrow"><div class="lrow-head"><span class="k">Final vault (Level 1)</span><span class="v">${G.gold} gold</span></div></div>
      <div class="lrow"><div class="lrow-head"><span class="k">Final fish stock (Level 3)</span><span class="v">${G.fish} / 500</span></div></div>
    </div>
    <p class="dim" style="margin-top:14px">Bigger challenges lie ahead: money, taxation, cycles and growth — coming in the full version.</p>
    <div class="btnrow"><button class="main" onclick="location.reload()">Play again</button></div>
  </div>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".bar-you").forEach(b=>b.style.width=b.dataset.w+"%");
  }));
}

screenTitle();
</script>
</body>
</html>
